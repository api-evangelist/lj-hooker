- url: https://www.ljhooker.com.au/about-us
  type: About
  note: 1928 Maroubra founding, 390 businesses, 4,000 people, AUD$20bn 2024 transactions, ~100,000 properties under management valued ~AUD$82bn, AU + NZ.
- url: https://www.ljhooker.com.au/
  type: Website
  note: Brand-domain map, social links, HubSpot hosting, Agentpoint search assets.
- url: https://assets.ljhooker.com/agentpoint-search-prod/js/lj-hooker.js
  type: ClientBundle
  note: Only evidence of a machine-readable contract; basePath https://api01.ljx.com.au, empty authentications map, 14 endpoints.
- url: https://www.reso.org/certificates/
  type: CertificationDirectory
  note: Negative evidence for RESO certification.

actions:
  apisYmlCreated: true
  apisListed: 0
  openapiHarvested: false
  specsCount: 0
  openapiDirectoryOmitted: true
  reason: >-
    No OpenAPI, Swagger, AsyncAPI, Postman collection or OData $metadata
    document is served by any LJ Hooker or vendor host. The endpoint inventory
    above was faithfully harvested from the vendor's generated client bundle,
    but authoring an OpenAPI document from observed behaviour would be
    fabrication, so no spec was written. The openapi/ directory is therefore
    omitted.
