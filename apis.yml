name: LJ Hooker
kind: company
description: >-
  LJ Hooker is one of the largest residential and commercial real estate
  brokerage and property management networks in Australia and New Zealand.
  Founded in Maroubra, Sydney in 1928, the franchise network reports 390
  businesses and around 4,000 sales professionals, property managers and support
  staff, facilitated more than AUD$20 billion in property transactions during
  2024, and manages roughly 100,000 properties valued at about AUD$82 billion on
  behalf of investors. It operates across residential sales and rentals
  (ljhooker.com.au), commercial (ljhcommercial.com.au), rural (ljhrural.com.au),
  land and projects (ljhland.com.au) and New Zealand (ljhooker.co.nz). LJ Hooker
  sits at the agency layer of the Australian property value chain — below the
  REA Group / Domain portal duopoly that distributes its listings, and upstream
  of PEXA electronic conveyancing and the PropTrack / CoreLogic valuation data
  concentration. Its API posture is honestly stated as none-published: there is
  no developer portal, no published API documentation, no API terms of use and
  no partner or data-feed programme on any LJ Hooker domain. The only
  programmatic surface located is an undocumented, vendor-operated website
  backend at api01.ljx.com.au, generated by OpenAPI Generator and consumed by
  the Agentpoint-built property search front end; that OpenAPI definition is not
  published. RESO — the Real Estate Standards Organization Web API and Data
  Dictionary — is a North American, NAR-driven regime with no Australian
  footprint, and LJ Hooker appears nowhere in the RESO certificates directory.
